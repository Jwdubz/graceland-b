<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graceland Wedding Chapel</title>
<meta name="description" content="Graceland Wedding Chapel, Las Vegas. Presents A Storybook Chapel. 619.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3ece4">
<meta property="og:type" content="website">
<meta property="og:title" content="Graceland Wedding Chapel">
<meta property="og:description" content="Graceland Wedding Chapel, Las Vegas. Presents A Storybook Chapel. 619.">
<meta property="og:url" content="https://graceland.jarrettwroten.com/">
<meta property="og:image" content="https://graceland.jarrettwroten.com/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Graceland Wedding Chapel">
<meta name="twitter:description" content="Graceland Wedding Chapel, Las Vegas. Presents A Storybook Chapel. 619.">
<meta name="twitter:image" content="https://graceland.jarrettwroten.com/img/og.jpg">
<link rel="preload" href="img/hero-poster.jpg" as="image">
<link rel="preload" href="fonts/6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxC9TeA.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">Skip to Content</a>
<div class="loader" aria-hidden="true"><img src="img/logo.png" alt=""></div>
<header class="hdr">
  <a class="hdr__mark" href="#top"><img src="img/logo.png" alt="Graceland Wedding Chapel"></a>
  <a class="btn" href="tel:{{PHONE}}">Call</a>
</header>
<main id="main">
  <section class="hero" id="top">
    <div class="hero__stage media" style="background-image:url(img/hero-poster.jpg)">
      <video class="film" id="film-hero" autoplay muted loop playsinline preload="auto" poster="img/hero-poster.jpg">
        <source src="film/hero.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero__sheet">
      <h1 class="hero__h">
        <span class="hl" data-split>Graceland</span>
        <span class="hl" data-split>Wedding</span>
        <span class="hl" data-split data-payoff>Chapel</span>
      </h1>
      <!-- 619 is painted on the pole in front.jpg, sign.jpg, and night.jpg. Street name is not in the assets. -->
      <p class="hero__place" data-reveal>619, Las Vegas</p>
    </div>
  </section>

  <section class="walk">
    <img src="img/trad-cer.jpg" width="1067" height="1600" alt="A couple walking the aisle toward the white arch at Graceland Wedding Chapel">
  </section>

  <section class="chapter">
    <div class="sheet">
      <!-- Line painted on the roadside sign in front.jpg and sign.jpg. -->
      <h2 data-split>Presents A Storybook Chapel</h2>
    </div>
    <img class="frame" src="img/front.jpg" width="1000" height="750" alt="Graceland Wedding Chapel, the white building, blue roof, stone steeple, and the sign on pole 619">
  </section>

  <section class="chapter">
    <div class="sheet sheet--end">
      <!-- Words on the blue sign at the building in cadillac.jpg. -->
      <h2 data-split>Chapel Entrance</h2>
    </div>
    <img class="frame" src="img/cadillac.jpg" width="1600" height="1067" alt="A couple beside a pink car at the Chapel Entrance of Graceland Wedding Chapel">
  </section>

  <section class="king">
    <div class="sheet">
      <!-- Printed on the shirt in photos/gifts/Graceland-Chapel-T-Shirt-Just-Married-by-the-King-.webp -->
      <h2 data-split>Just Married by the King</h2>
    </div>
    <div class="king__pair">
      <img src="img/celebrate.jpg" width="1600" height="1067" alt="A couple with an Elvis performer inside Graceland Wedding Chapel">
      <div class="king__film media" style="background-image:url(img/chapel-poster.jpg)">
        <video class="film" id="film-chapel" autoplay muted loop playsinline preload="metadata" poster="img/chapel-poster.jpg">
          <source src="film/chapel.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

  <section class="rose">
    <img src="img/bouquet.webp" width="320" height="320" alt="12 Rose Hand Tied Bouquet">
    <div class="sheet">
      <h2 data-split>12 Rose Hand Tied Bouquet</h2>
      <!-- VERIFY: 125 is the number in the filename 12-Rose-Hand-Tied-Bouquet-125.webp. It is not printed on the photograph. -->
      <p class="price" data-reveal>$125</p>
    </div>
  </section>

  <section class="close" id="call">
    <img src="img/night.jpg" width="500" height="500" alt="The Graceland Wedding Chapel sign lit at night, pole number 619">
    <div class="sheet">
      <h2 data-split>Graceland Wedding Chapel</h2>
      <div class="close__row">
        <a class="btn" href="tel:{{PHONE}}" data-reveal>Call</a>
        <button class="top" type="button" data-top>Back To Top</button>
      </div>
    </div>
  </section>
</main>
<button class="motion" type="button" aria-pressed="false" aria-label="Pause Motion"><span class="motion__txt">Pause</span></button>
<script src="vendor/gsap.min.js" defer></script>
<script src="vendor/ScrollTrigger.min.js" defer></script>
<script src="vendor/SplitText.min.js" defer></script>
<script src="vendor/lenis.min.js" defer></script>
<script src="kit.js" defer></script>
<script src="site.js" defer></script>
</body>
</html>
